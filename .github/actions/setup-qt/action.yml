name: "Set up Qt system dependencies"
description: "Install the Qt/xcb system libraries (and xvfb) OpenSAK's GUI tests need on Linux."

runs:
  using: "composite"
  steps:
    - name: Install Qt system dependencies
      shell: bash
      run: |
        # Issue: repeated hangs of 12-25+ minutes on this step, observed
        # across several unrelated workflow runs on release day (2026-08-19)
        # — apt-get update/install stalling on a slow/unresponsive mirror
        # (azure.archive.ubuntu.com, the default on GitHub-hosted Ubuntu
        # runners) with no bound on how long a single connection attempt
        # can hang. Two layers of defence, both bounded:
        #   1. Acquire::Retries/Timeout tells apt itself to give up on a
        #      slow connection quickly (15s) and retry a bounded number of
        #      times, instead of hanging indefinitely on one bad response.
        #   2. An outer retry loop (3 attempts, short backoff) covers the
        #      case where an entire apt-get invocation fails outright
        #      (e.g. transient DNS/mirror error), not just a slow single
        #      request.
        # A run that's still stuck after this either fails fast (visible,
        # actionable in the Actions UI) or self-recovers on the next
        # attempt — instead of silently occupying a runner for 20+ minutes.
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"

        for attempt in 1 2 3; do
          if sudo apt-get update -qq $APT_OPTS && \
             sudo apt-get install -y --no-install-recommends $APT_OPTS \
               xvfb libgl1-mesa-dev libegl1 libxkbcommon-x11-0 \
               libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
               libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
               libxcb-xfixes0 libxcb-shape0 libglib2.0-0 \
               libxcb-cursor0 libfontconfig1 libfreetype6; then
            exit 0
          fi
          echo "::warning::apt-get attempt $attempt failed, retrying in 15s..."
          sleep 15
        done

        echo "::error::apt-get failed after 3 attempts"
        exit 1
